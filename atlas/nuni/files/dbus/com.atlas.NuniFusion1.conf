<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.atlas.NuniFusion1"/>
    <allow send_destination="com.atlas.NuniFusion1"/>
    <allow receive_sender="com.atlas.NuniFusion1"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.atlas.NuniFusion1"/>
    <allow receive_sender="com.atlas.NuniFusion1"/>
  </policy>

  <!-- 내려받아 설치한 앱(대시보드)은 package-manager 그룹으로 실행된다. 패키지 관리자가 설치 때 기본 거부 정책을
       따로 만들므로 group 정책으로 허용한다(deploy/setup_on_device.sh가 같은 내용을 /etc에 쓴다). -->
  <policy group="package-manager">
    <allow send_destination="com.atlas.NuniFusion1"/>
    <allow receive_sender="com.atlas.NuniFusion1"/>
  </policy>
</busconfig>
